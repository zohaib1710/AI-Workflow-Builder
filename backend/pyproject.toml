[project]
name = "ai-workflow-builder-backend"
version = "0.1.0"
description = "Backend application shell for AI Workflow Builder"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.9.0",
    "pytest>=9.1.1",
]
